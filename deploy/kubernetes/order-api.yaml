apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: microservices-baseline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: order-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          #livenessProbe:
          #  httpGet:
          #    path: /health
          #    port: 8080
          #readinessProbe:
          #  httpGet:
          #    path: /health
          #    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: microservices-baseline
spec:
  selector:
    app: order-api
  ports:
    - port: 80
      targetPort: 8080
